server.port=8080

# Active Spring Profile (dev uses persistent file H2 with MySQL syntax; set to 'mysql' to use MySQL)
spring.profiles.active=dev

# Application Information
spring.application.name=Smart Traffic Management System (STMS)

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# File upload / multipart configuration if needed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
